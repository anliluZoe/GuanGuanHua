<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <link rel="stylesheet" href="leaflet/leaflet.css" />
  <style>
    html, body { height: 100%; margin: 0; background: #e7f2f4; }
    #map { position: absolute; inset: 0; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="leaflet/leaflet.js"></script>
  <script>
    const colors = { "住宿": "#6BA3C4", "美食": "#F07A5C", "风景": "#4DB6A0", "博物馆": "#A78BC4", "杂物店": "#D4A84B" };
    const map = L.map("map", { zoomControl: true }).setView([25.27, 110.29], 6);
    const tiles = [
      {
        url: "https://wprd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scl=1&style=7&x={x}&y={y}&z={z}",
        options: { subdomains: "1234", maxZoom: 18, attribution: "高德" }
      },
      {
        url: "https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png",
        options: { subdomains: "abcd", maxZoom: 19, attribution: "CARTO" }
      },
      {
        url: "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
        options: { maxZoom: 19, attribution: "&copy; OpenStreetMap" }
      }
    ];
    let tileIndex = 0;
    let tileLayer = L.tileLayer(tiles[0].url, tiles[0].options).addTo(map);
    let tileErrors = 0;
    tileLayer.on("tileerror", function () {
      tileErrors += 1;
      if (tileErrors < 4 || tileIndex >= tiles.length - 1) return;
      map.removeLayer(tileLayer);
      tileIndex += 1;
      tileErrors = 0;
      tileLayer = L.tileLayer(tiles[tileIndex].url, tiles[tileIndex].options).addTo(map);
    });
    const layer = L.layerGroup().addTo(map);
    function render(stops) {
      layer.clearLayers();
      const pts = (stops || []).filter(function (s) { return s.lat != null && s.lng != null; });
      pts.forEach(function (s, i) {
        L.circleMarker([s.lat, s.lng], {
          radius: 8,
          color: colors[s.kind] || "#6BA3C4",
          fillColor: colors[s.kind] || "#6BA3C4",
          fillOpacity: 0.9,
          weight: 2
        }).bindPopup((i + 1) + ". " + s.name).addTo(layer);
      });
      if (pts.length >= 2) {
        L.polyline(pts.map(function (s) { return [s.lat, s.lng]; }), { color: "#6BA3C4", weight: 3 }).addTo(layer);
      }
      map.invalidateSize();
      if (pts.length) {
        map.fitBounds(L.latLngBounds(pts.map(function (s) { return [s.lat, s.lng]; })).pad(0.2));
      }
      setTimeout(function () { map.invalidateSize(); }, 200);
    }
    window.renderStops = render;
  </script>
</body>
</html>
