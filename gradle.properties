org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# App version. Bump BOTH before each GitHub Release or sideload overwrite.
# versionCode MUST increase or Android will refuse to install over the current APK.
# Override for CI: ./gradlew assembleDebug -PappVersionCode=3 -PappVersionName=1.1.1
appVersionCode=2
appVersionName=1.1.0
