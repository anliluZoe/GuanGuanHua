name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: watchmoney-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-secrets:
    name: 检查 Secrets / 计算版本号
    runs-on: ubuntu-latest
    outputs:
      version_code: ${{ steps.meta.outputs.version_code }}
      version_name: ${{ steps.meta.outputs.version_name }}
    steps:
      - id: meta
        name: 计算 versionCode / versionName
        run: |
          code=$((1000 + ${{ github.run_number }}))
          name="1.2.${{ github.run_number }}"
          echo "version_code=$code" >> "$GITHUB_OUTPUT"
          echo "version_name=$name" >> "$GITHUB_OUTPUT"
          echo "versionCode=$code versionName=$name"
      - name: 确认部署 Secrets 已配置
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          [[ -z "$DEPLOY_HOST" ]] && missing+=(DEPLOY_HOST)
          [[ -z "$DEPLOY_USER" ]] && missing+=(DEPLOY_USER)
          [[ -z "$DEPLOY_SSH_KEY" ]] && missing+=(DEPLOY_SSH_KEY)
          [[ -z "$ANDROID_KEYSTORE_BASE64" ]] && missing+=(ANDROID_KEYSTORE_BASE64)
          [[ -z "$ANDROID_KEYSTORE_PASSWORD" ]] && missing+=(ANDROID_KEYSTORE_PASSWORD)
          [[ -z "$ANDROID_KEY_ALIAS" ]] && missing+=(ANDROID_KEY_ALIAS)
          [[ -z "$ANDROID_KEY_PASSWORD" ]] && missing+=(ANDROID_KEY_PASSWORD)
          if [[ ${#missing[@]} -ne 0 ]]; then
            echo "::error::缺少 GitHub Actions Secrets: ${missing[*]}"
            echo "请到仓库 Settings → Secrets and variables → Actions 添加："
            echo "  DEPLOY_HOST                 阿里云主机 IP 或域名"
            echo "  DEPLOY_USER                 SSH 用户名"
            echo "  DEPLOY_SSH_KEY              SSH 私钥全文（含 BEGIN/END 行）"
            echo "  ANDROID_KEYSTORE_BASE64     upload keystore 文件的 base64（建议单行、无换行）"
            echo "  ANDROID_KEYSTORE_PASSWORD   keystore 密码"
            echo "  ANDROID_KEY_ALIAS           密钥别名"
            echo "  ANDROID_KEY_PASSWORD        密钥密码"
            echo "可选："
            echo "  DEPLOY_PATH     服务器仓库目录；不设则自动用 ~/watchMoney 或 ~/saveMoney"
            echo "说明见 docs/deploy.md"
            exit 1
          fi
          echo "必填 Secrets 已配置（DEPLOY_PATH 可选）"

  test-backend:
    name: 后端测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: npm test
        working-directory: backend
        run: npm ci && npm test

  deploy-backend:
    name: 部署后端
    needs: [check-secrets, test-backend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: SSH 拉取代码并重建 savemoney-api
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 25m
          envs: DEPLOY_PATH,REPO_URL
          script_path: .github/scripts/remote-deploy.sh
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          REPO_URL: https://github.com/${{ github.repository }}.git

  build-apk:
    name: 构建 Android debug APK
    needs: check-secrets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Google 已下线旧 SDK `tools` 包；不要用 action 默认值 `tools platform-tools`。
          packages: "platform-tools build-tools;35.0.0 platforms;android-35"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
      - name: 非交互接受 Android SDK 许可
        run: yes | sdkmanager --licenses >/dev/null || true
      - name: 解码 upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "::error::缺少 Secret ANDROID_KEYSTORE_BASE64，无法用固定签名打包发布 APK"
            echo "请到仓库 Settings → Secrets and variables → Actions 添加该 Secret。"
            echo "说明见 docs/deploy.md"
            exit 1
          fi
          # GitHub Secret 里偶发换行/空格；去掉空白后再解码，避免 INSTALL 签名抖动
          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/upload.jks"; then
            echo "::error::ANDROID_KEYSTORE_BASE64 不是合法 base64。请用 keystore 文件做 base64（建议单行、无换行）。"
            echo "说明见 docs/deploy.md"
            exit 1
          fi
          if [[ ! -s "$RUNNER_TEMP/upload.jks" ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 解码后文件为空。Secret 必须是 .jks/.keystore 文件的 base64，不要带 PEM 头或换行杂质。"
            echo "说明见 docs/deploy.md"
            exit 1
          fi
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          echo "已解码 upload keystore → $RUNNER_TEMP/upload.jks"
      - name: assembleDebug 并重命名为 saveMoney.apk
        env:
          VERSION_CODE: ${{ needs.check-secrets.outputs.version_code }}
          VERSION_NAME: ${{ needs.check-secrets.outputs.version_name }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          [[ -z "$ANDROID_KEYSTORE_PATH" ]] && missing+=(ANDROID_KEYSTORE_PATH)
          [[ -z "$ANDROID_KEYSTORE_PASSWORD" ]] && missing+=(ANDROID_KEYSTORE_PASSWORD)
          [[ -z "$ANDROID_KEY_ALIAS" ]] && missing+=(ANDROID_KEY_ALIAS)
          [[ -z "$ANDROID_KEY_PASSWORD" ]] && missing+=(ANDROID_KEY_PASSWORD)
          if [[ ${#missing[@]} -ne 0 ]]; then
            echo "::error::打包发布 APK 缺少签名配置: ${missing[*]}"
            echo "本地 assembleDebug 无这些变量时会回退默认 debug 签名；CI 发布包必须用固定 upload keystore。"
            echo "请配置 Secrets：ANDROID_KEYSTORE_BASE64、ANDROID_KEYSTORE_PASSWORD、ANDROID_KEY_ALIAS、ANDROID_KEY_PASSWORD"
            echo "说明见 docs/deploy.md"
            exit 1
          fi
          if [[ ! -s "$ANDROID_KEYSTORE_PATH" ]]; then
            echo "::error::ANDROID_KEYSTORE_PATH 文件不存在或为空: $ANDROID_KEYSTORE_PATH"
            exit 1
          fi
          chmod +x gradlew
          echo "applicationId=com.guanguanhua.app（新应用身份；APK 文件名仍为 saveMoney.apk，以兼容 /api/update）"
          echo "打包 versionCode=$VERSION_CODE versionName=$VERSION_NAME"
          echo "使用固定 upload keystore 签名，以便后续 Actions 构建可覆盖安装"
          ./gradlew assembleDebug --no-daemon \
            -PappVersionCode="$VERSION_CODE" \
            -PappVersionName="$VERSION_NAME"
          cp app/build/outputs/apk/debug/app-debug.apk saveMoney.apk
          ls -lh saveMoney.apk
      - uses: actions/upload-artifact@v4
        with:
          name: saveMoney-apk
          path: saveMoney.apk
          if-no-files-found: error
          retention-days: 14

  publish-apk:
    name: 发布 APK 到 updates/
    needs: [check-secrets, deploy-backend, build-apk]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: saveMoney-apk
      - name: scp saveMoney.apk 到服务器
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: saveMoney.apk
          target: /tmp/watchmoney-ci
          overwrite: true
          rm: true
      - name: docker cp 并 publish-update.sh
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 10m
          envs: VERSION_CODE,VERSION_NAME,UPDATE_NOTES
          script_path: .github/scripts/remote-publish.sh
        env:
          VERSION_CODE: ${{ needs.check-secrets.outputs.version_code }}
          VERSION_NAME: ${{ needs.check-secrets.outputs.version_name }}
          UPDATE_NOTES: "ci-${{ github.run_number }}-${{ github.sha }}"
